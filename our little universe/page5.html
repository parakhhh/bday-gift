<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday My Love ♡</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Courier+Prime&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background-color: #262530;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(255, 215, 225, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(255, 230, 180, 0.12) 0%, transparent 40%),
        radial-gradient(#424052 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 24px 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Courier Prime', monospace;
      overflow: hidden;
      position: relative;
    }

    /* Twinkling Shiny Sparkles */
    .sparkle {
      position: absolute;
      color: #ffe8a3;
      font-size: 16px;
      pointer-events: none;
      animation: twinkle 2.5s infinite ease-in-out;
      text-shadow: 0 0 8px #ffd166, 0 0 15px #ff9ebb;
      z-index: 1;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.3) rotate(20deg); }
    }

    /* Main Scrapbook Wrapper */
    .stage {
      position: relative;
      width: 100%;
      max-width: 720px;
      height: 560px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Floating Polaroid Pictures */
    .polaroid {
      position: absolute;
      background: #fdfbf7;
      padding: 10px 10px 26px 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
      border-radius: 3px;
      width: 145px;
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), z-index 0.1s;
      cursor: pointer;
      z-index: 2;
    }

    .polaroid:hover {
      transform: scale(1.15) rotate(0deg) !important;
      z-index: 10;
      box-shadow: 0 15px 35px rgba(255, 220, 225, 0.3);
    }

    /* Washi Tape Effect on Polaroids */
    .polaroid::before {
      content: '';
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%) rotate(-3deg);
      width: 55px;
      height: 18px;
      background: rgba(235, 168, 168, 0.65);
      border-left: 1px dashed rgba(255,255,255,0.5);
      border-right: 1px dashed rgba(255,255,255,0.5);
    }

    .polaroid img {
      width: 100%;
      height: 125px;
      object-fit: cover;
      border-radius: 2px;
      display: block;
      background: #eee;
    }

    .polaroid span {
      display: block;
      text-align: center;
      font-family: 'Caveat', cursive;
      font-size: 16px;
      color: #444;
      margin-top: 6px;
    }

    /* Polaroid Positions */
    .p1 { top: 25px; left: 30px; transform: rotate(-10deg); }
    .p2 { top: 20px; right: 30px; transform: rotate(9deg); }
    .p3 { bottom: 25px; left: 35px; transform: rotate(7deg); }
    .p4 { bottom: 20px; right: 35px; transform: rotate(-8deg); }

    /* Center Shiny Scrapbook Card */
    .center-card {
      background: linear-gradient(135deg, #fffdf9 0%, #f9f2ec 100%);
      border: 1.5px dashed #c9b5a8;
      padding: 32px 28px;
      width: 350px;
      text-align: center;
      border-radius: 6px;
      box-shadow: 
        0 15px 35px rgba(0, 0, 0, 0.5),
        0 0 25px rgba(255, 210, 215, 0.25);
      position: relative;
      z-index: 5;
      overflow: hidden;
    }

    /* Shimmering Gloss Sweep */
    .center-card::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -60%;
      width: 40%;
      height: 200%;
      background: linear-gradient(
        to right,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.7) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      transform: rotate(25deg);
      animation: shimmer 4.5s infinite;
      pointer-events: none;
    }

    @keyframes shimmer {
      0% { left: -60%; }
      40%, 100% { left: 130%; }
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #7a6e67;
      border-bottom: 1px dotted #cbbcb2;
      padding-bottom: 8px;
      margin-bottom: 15px;
    }

    .badge {
      display: inline-block;
      background: #fae3e3;
      color: #c04848;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid #e6b8b8;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }

    h1 {
      font-family: 'Caveat', cursive;
      font-size: 36px;
      color: #2b2626;
      margin: 5px 0 10px 0;
      line-height: 1.1;
      text-shadow: 0 2px 10px rgba(240, 160, 160, 0.35);
    }

    p {
      font-size: 13px;
      color: #554c4c;
      line-height: 1.6;
      margin-bottom: 22px;
    }

    /* Shiny Gradient Red Button */
    .enter-btn {
      display: inline-block;
      background: linear-gradient(135deg, #d15252 0%, #a83232 100%);
      color: #fff;
      text-decoration: none;
      padding: 12px 22px;
      border-radius: 6px;
      font-size: 13.5px;
      box-shadow: 0 5px 15px rgba(192, 72, 72, 0.45);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .enter-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(220, 90, 90, 0.65);
    }

    /* Mobile Responsive Adjustment */
    @media (max-width: 650px) {
      .stage {
        height: auto;
        flex-direction: column;
        padding: 30px 15px;
        gap: 20px;
      }
      .polaroid {
        position: static;
        width: 130px;
        display: inline-block;
      }
      .photo-row {
        display: flex;
        gap: 15px;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <!-- Sparkles Container -->
  <div id="sparkles"></div>

  <div class="stage">
    <!-- Top / Left Polaroids -->


    <!-- Center Shiny Birthday Card -->
    <div class="center-card">
      <div class="card-top">
        <span>K & P</span>
        <span>25.10.2023</span>
      </div>

      <div class="badge">✨ patidev ✨</div>

      <h1>happy birthday,<br>my favourite person ♡♡</h1>

      <p>
        the world got a whole lot brighter the day you were born.<br>
        step inside our little universe for your birthday surprise... 🎂💗
      </p>

      <!-- Links to your existing Page 2 -->
      <a href="page6.html" class="enter-btn">
        open your birthday universe (っ◔◡◔)っ →
      </a>
    </div>
    



    <!-- Bot


  <script>
    // Generate twinkling stars/sparkles across the screen
    const sparkleContainer = document.getElementById('sparkles');
    const symbols = ['✨', '✦', '⋆', '♡', '✧'];

    for (let i = 0; i < 28; i++) {
      const sp = document.createElement('div');
      sp.classList.add('sparkle');
      sp.innerText = symbols[Math.floor(Math.random() * symbols.length)];
      sp.style.left = Math.random() * 100 + 'vw';
      sp.style.top = Math.random() * 100 + 'vh';
      sp.style.animationDelay = (Math.random() * 3) + 's';
      sp.style.fontSize = (Math.random() * 10 + 12) + 'px';
      sparkleContainer.appendChild(sp);
    }
  </script>

</body>
</html>
